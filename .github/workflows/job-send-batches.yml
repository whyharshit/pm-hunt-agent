name: Job outreach send batches

# Runs every 15 min from 9:00-11:00 IST (03:30-05:30 UTC) = 9 runs/day, so
# JOB_SEND_MAX_PER_DAY (10/run) reaches ~90/day inside one 2-hour window in small batches
# rather than a single burst. Vercel's own cron is maxed at 2 jobs (Hobby plan) — discover +
# funding already use both — so this rides on GitHub Actions instead, hitting the same
# endpoint the funding cron uses.
#
# Deliberately does NOT set autosend=true, so this only runs the job-application pipeline
# (prepare + send + linkedin scan). Founder cold-outreach stays on its own once-daily schedule
# inside the real Vercel cron, unaffected by this.
on:
  schedule:
    - cron: '30,45 3 * * *'      # 09:00, 09:15 IST
    - cron: '0,15,30,45 4 * * *' # 09:30, 09:45, 10:00, 10:15 IST
    - cron: '0,15,30 5 * * *'    # 10:30, 10:45, 11:00 IST
  workflow_dispatch: {}

jobs:
  send-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger job-send batch
        run: |
          curl -sf -X GET "https://pm-hunt-agent.vercel.app/api/funding?jobs=true" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
